name: Release

# Ein Versions-Tag (1.2.3 oder 1.2.3-rc.1) veröffentlicht das Image. Es wird zuerst nur per
# Digest hochgeladen und bekommt die Version erst, wenn alle Prüfungen bestanden sind.
on:
  push:
    tags:
      - "*"

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  validate-tag:
    name: Tag prüfen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Ohne "+build": In Docker-Tags ist "+" nicht erlaubt
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::Tag ist keine Version wie 1.2.3 oder 1.2.3-rc.1"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  publish:
    name: Bauen und prüfen
    needs: [validate-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Cosign ohne eigenen Schlüssel
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ruff
        run: pipx run ruff==0.17.6 check .

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Unit-Tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          build-args: VERSION=${{ env.VERSION }}

      - name: Image für den Smoke-Test bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: VERSION=${{ env.VERSION }}
          tags: seafile-archiver:release
          load: true

      - name: Smoke-Test
        run: scripts/smoke.sh seafile-archiver:release "$VERSION"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Per Digest hochladen
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: VERSION=${{ env.VERSION }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=seafile-archiver
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT

      - name: Lizenzscan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: license
          severity: CRITICAL
          format: table
          exit-code: "1"

      - name: Schwachstellenscan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"

      - name: SBOM erzeugen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom-seafile-archiver.cdx.json

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Image signieren
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-seafile-archiver.cdx.json
          if-no-files-found: error

  release:
    name: Version vergeben
    needs: [validate-tag, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub-Release anlegen
      packages: write
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image mit der Version taggen
        run: docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE@$DIGEST"

      - name: GitHub-Release anlegen
        run: |
          args=()
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$VERSION" --generate-notes \
            --notes "Image: \`$IMAGE:$VERSION\` (\`$DIGEST\`)" "${args[@]}" \
            sbom-seafile-archiver.cdx.json

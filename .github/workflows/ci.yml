name: CI

# Bei jedem Pull Request und von Hand. Das Release testet den getaggten Commit erneut.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests und Smoke-Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ruff
        run: pipx run ruff==0.17.6 check .

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Die Tests laufen beim Bauen, mit denselben Debian-Paketen wie im Image
      - name: Unit-Tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Image bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: seafile-archiver:ci
          load: true

      - name: Smoke-Test
        run: scripts/smoke.sh seafile-archiver:ci

# S3-Variante der Testumgebung (MinIO). Nutzung:
#   docker compose -f compose.yml -f compose.s3.yml up -d --build
# Achtung: MinIO veröffentlicht keine Docker-Images mehr (Docker Hub/Quay gesperrt),
# hier wird ein lokal vorhandenes Image vom September 2025 verwendet.
services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER=seafile
      - MINIO_ROOT_PASSWORD=seafile-s3-secret
    ports:
      - "127.0.0.1:9001:9001"   # Konsole
    volumes:
      - minio:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set m http://minio:9000 seafile seafile-s3-secret >/dev/null 2>&1; do sleep 1; done
        mc mb -p m/seafile-commits m/seafile-fs m/seafile-blocks

  seafile:
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment: &s3
      - SEAF_SERVER_STORAGE_TYPE=s3
      - S3_COMMIT_BUCKET=seafile-commits
      - S3_FS_BUCKET=seafile-fs
      - S3_BLOCK_BUCKET=seafile-blocks
      - S3_KEY_ID=seafile
      - S3_SECRET_KEY=seafile-s3-secret
      - S3_HOST=minio:9000
      - S3_AWS_REGION=us-east-1
      - S3_USE_HTTPS=false
      - S3_USE_V4_SIGNATURE=true
      - S3_PATH_STYLE_REQUEST=true

  archiver:
    environment: *s3

volumes:
  minio:
